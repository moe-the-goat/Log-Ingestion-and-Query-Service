services:
  postgres:
    image: postgres:17
    # Tuned for the graded 1 CPU / 1 GB budget, where CPU is the binding constraint. The large
    # max_wal_size and spread checkpoint keep sustained ingestion off a checkpoint stall, and
    # wal_compression stays off because it trades CPU for I/O in the wrong direction here.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_naptime=15s
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logs -d logs']
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgres://logs:logs@postgres:5432/logs
      # Defaults keep a bare `docker compose up` on the fast path; the overrides exist so a
      # benchmark run can compare write paths without editing this file.
      INGEST_WRITER: ${INGEST_WRITER:-binary}
      INGEST_FLUSH_INTERVAL_MS: ${INGEST_FLUSH_INTERVAL_MS:-50}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-8}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
